<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-ORS Powder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(217,245,249)"/>
      <stop offset="100%" stop-color="rgb(191,238,244)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-ORS Powder)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#00BCD4" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#00BCD4" opacity="0.06"/>
  
        <!-- Sachet -->
        <path d="M75,70 L165,70 L160,160 L80,160 Z" fill="#00BCD4" stroke="rgb(0,160,180)" stroke-width="1.5"/>
        <!-- Top seal -->
        <path d="M75,70 L165,70 L163,80 L77,80 Z" fill="rgb(0,160,180)"/>
        <!-- Label area -->
        <rect x="88" y="95" width="64" height="40" rx="4" fill="white" opacity="0.85"/>
        <!-- Label lines -->
        <line x1="95" y1="107" x2="145" y2="107" stroke="#00BCD4" stroke-width="2" opacity="0.6"/>
        <line x1="95" y1="115" x2="138" y2="115" stroke="#00BCD4" stroke-width="1.5" opacity="0.4"/>
        <line x1="95" y1="123" x2="142" y2="123" stroke="#00BCD4" stroke-width="1.5" opacity="0.4"/>
        <!-- Tear notch -->
        <path d="M75,85 L80,88 L75,91" fill="none" stroke="rgb(0,160,180)" stroke-width="1"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(0,160,180)">ORS Powder</text>
</svg>