<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-Sanitizer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(217,239,237)"/>
      <stop offset="100%" stop-color="rgb(191,229,225)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-Sanitizer)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#009688" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#009688" opacity="0.06"/>
  
        <!-- Bottle cap -->
        <rect x="95" y="52" width="50" height="18" rx="4" fill="rgb(0,128,116)"/>
        <!-- Bottle neck -->
        <rect x="100" y="68" width="40" height="12" fill="rgb(102,192,184)"/>
        <!-- Bottle body -->
        <rect x="82" y="78" width="76" height="80" rx="8" fill="#009688" stroke="rgb(0,128,116)" stroke-width="1.5"/>
        <!-- Label -->
        <rect x="90" y="95" width="60" height="35" rx="4" fill="white" opacity="0.85"/>
        <!-- Label lines -->
        <line x1="97" y1="105" x2="143" y2="105" stroke="#009688" stroke-width="2" opacity="0.6"/>
        <line x1="97" y1="112" x2="135" y2="112" stroke="#009688" stroke-width="1.5" opacity="0.4"/>
        <line x1="97" y1="118" x2="140" y2="118" stroke="#009688" stroke-width="1.5" opacity="0.4"/>
        <!-- Shine -->
        <rect x="86" y="82" width="8" height="60" rx="4" fill="white" opacity="0.15"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(0,128,116)">Sanitizer</text>
</svg>