<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-Multivitamin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(226,229,244)"/>
      <stop offset="100%" stop-color="rgb(207,212,237)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-Multivitamin)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#3F51B5" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#3F51B5" opacity="0.06"/>
  
        <!-- Main capsule -->
        <rect x="70" y="82" width="100" height="40" rx="20" fill="#3F51B5" stroke="rgb(54,69,154)" stroke-width="1.5"/>
        <rect x="70" y="82" width="50" height="40" rx="20" fill="rgb(140,151,211)"/>
        <!-- Shine -->
        <ellipse cx="120" cy="94" rx="25" ry="6" fill="white" opacity="0.25"/>
        <!-- Small capsule -->
        <rect x="90" y="130" width="60" height="24" rx="12" fill="#3F51B5" opacity="0.5" stroke="rgb(54,69,154)" stroke-width="1"/>
        <rect x="90" y="130" width="30" height="24" rx="12" fill="rgb(140,151,211)" opacity="0.5"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(54,69,154)">Multivitamin</text>
</svg>