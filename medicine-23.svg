<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-Metformin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(232,225,244)"/>
      <stop offset="100%" stop-color="rgb(217,206,237)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-Metformin)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#673AB7" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#673AB7" opacity="0.06"/>
  
        <!-- Tablet strip -->
        <rect x="55" y="75" width="130" height="55" rx="8" fill="rgb(164,137,212)" stroke="rgb(88,49,156)" stroke-width="1.5"/>
        <rect x="58" y="78" width="124" height="49" rx="6" fill="rgb(187,166,223)"/>
        <!-- Individual tablets -->
        <circle cx="85" cy="102" r="14" fill="#673AB7" opacity="0.9"/>
        <circle cx="85" cy="102" r="9" fill="rgb(133,97,197)" opacity="0.5"/>
        <circle cx="120" cy="102" r="14" fill="#673AB7" opacity="0.9"/>
        <circle cx="120" cy="102" r="9" fill="rgb(133,97,197)" opacity="0.5"/>
        <circle cx="155" cy="102" r="14" fill="#673AB7" opacity="0.9"/>
        <circle cx="155" cy="102" r="9" fill="rgb(133,97,197)" opacity="0.5"/>
        <!-- Score line on tablets -->
        <line x1="85" y1="93" x2="85" y2="111" stroke="rgb(88,49,156)" stroke-width="0.8" opacity="0.4"/>
        <line x1="120" y1="93" x2="120" y2="111" stroke="rgb(88,49,156)" stroke-width="0.8" opacity="0.4"/>
        <line x1="155" y1="93" x2="155" y2="111" stroke="rgb(88,49,156)" stroke-width="0.8" opacity="0.4"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(88,49,156)">Metformin</text>
</svg>