<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-Antacid Gel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(240,223,243)"/>
      <stop offset="100%" stop-color="rgb(230,201,235)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-Antacid Gel)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#9C27B0" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#9C27B0" opacity="0.06"/>
  
        <!-- Bottle cap -->
        <rect x="95" y="52" width="50" height="18" rx="4" fill="rgb(133,33,150)"/>
        <!-- Bottle neck -->
        <rect x="100" y="68" width="40" height="12" fill="rgb(196,125,208)"/>
        <!-- Bottle body -->
        <rect x="82" y="78" width="76" height="80" rx="8" fill="#9C27B0" stroke="rgb(133,33,150)" stroke-width="1.5"/>
        <!-- Label -->
        <rect x="90" y="95" width="60" height="35" rx="4" fill="white" opacity="0.85"/>
        <!-- Label lines -->
        <line x1="97" y1="105" x2="143" y2="105" stroke="#9C27B0" stroke-width="2" opacity="0.6"/>
        <line x1="97" y1="112" x2="135" y2="112" stroke="#9C27B0" stroke-width="1.5" opacity="0.4"/>
        <line x1="97" y1="118" x2="140" y2="118" stroke="#9C27B0" stroke-width="1.5" opacity="0.4"/>
        <!-- Shine -->
        <rect x="86" y="82" width="8" height="60" rx="4" fill="white" opacity="0.15"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(133,33,150)">Antacid Gel</text>
</svg>