<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="bg-Bandages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(252,221,232)"/>
      <stop offset="100%" stop-color="rgb(250,199,216)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="200" rx="12" fill="url(#bg-Bandages)"/>
  <!-- Decorative circles -->
  <circle cx="30" cy="170" r="40" fill="#E91E63" opacity="0.06"/>
  <circle cx="210" cy="30" r="35" fill="#E91E63" opacity="0.06"/>
  
        <!-- Box main face -->
        <rect x="72" y="75" width="85" height="70" rx="4" fill="#E91E63" stroke="rgb(198,26,84)" stroke-width="1.5"/>
        <!-- Box top face -->
        <path d="M72,75 L90,60 L175,60 L157,75 Z" fill="rgb(242,120,161)" stroke="rgb(198,26,84)" stroke-width="1"/>
        <!-- Box side face -->
        <path d="M157,75 L175,60 L175,130 L157,145 Z" fill="rgb(210,27,89)" stroke="rgb(198,26,84)" stroke-width="1"/>
        <!-- Label on front -->
        <rect x="82" y="88" width="60" height="32" rx="3" fill="white" opacity="0.85"/>
        <!-- Cross symbol -->
        <rect x="106" y="95" width="12" height="3" rx="1" fill="#E91E63"/>
        <rect x="110.5" y="90.5" width="3" height="12" rx="1" fill="#E91E63"/>
        <!-- Label lines -->
        <line x1="89" y1="110" x2="135" y2="110" stroke="#E91E63" stroke-width="1.5" opacity="0.4"/>
        <line x1="89" y1="115" x2="128" y2="115" stroke="#E91E63" stroke-width="1.5" opacity="0.4"/>
      
  <!-- Product name -->
  <text x="120" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgb(198,26,84)">Bandages</text>
</svg>